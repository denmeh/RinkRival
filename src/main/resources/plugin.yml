name: NpcAiTest
version: '${version}'

main: com.github.denmeh.npcaitest.NpcAiTest
api-version: '1.20'
depend: [Citizens]

authors: [ denmeh ]

commands:
  npctest:
    description: Citizens NPC behavior-tree sandbox and ice-rink minigame
    usage: /npctest <spawn|come|tree|status|remove|arena|leave>
    permission: npctest.use

permissions:
  npctest.use:
    description: Use /npctest
    default: op
