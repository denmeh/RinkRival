name: RinkRival
version: '${version}'

main: com.github.denmeh.rinkrival.RinkRival
api-version: '1.20'
depend: [Citizens]

authors: [ denmeh ]

commands:
  rink:
    description: 1v1 ice hockey vs a Citizens rival, plus a small NPC sandbox
    usage: /rink <spawn|come|tree|status|remove|arena [easy|normal|hard]|leave>
    permission: rinkrival.use

permissions:
  rinkrival.use:
    description: Use /rink
    default: op
