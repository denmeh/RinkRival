name: NpcAiTest
version: '${version}'

main: com.github.denmeh.npcaitest.NpcAiTest
api-version: '1.20'
depend: [Citizens]

authors: [ denmeh ]

commands:
  npctest:
    description: Spawn a Citizens NPC and drive it with a behavior tree
    usage: /npctest <spawn|come|tree|status|remove|arena|unarena>
    permission: npctest.use

permissions:
  npctest.use:
    description: Use /npctest
    default: op
